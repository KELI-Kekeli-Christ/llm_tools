[package]
name = "llm-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pour les menus interactifs
dialoguer = "0.11"
# Pour les couleurs dans le terminal
console = "0.15"
# Pour gérer les processus et l'asynchrone
tokio = { version = "1", features = ["full"] }
# Pour les barres de chargement (optionnel mais pro)
indicatif = "0.17"